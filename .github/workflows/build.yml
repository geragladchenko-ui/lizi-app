name: Build Lizi Fire APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        shell: bash
        run: |
          set -e

          mkdir -p www

          if [ ! -f index.html ]; then
            echo "Ошибка: файл index.html не найден"
            exit 1
          fi

          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          npx cap init \
            "Lizi Fire" \
            "com.lizi.fire.assistant" \
            --web-dir www

          npx cap add android

      - name: Create Android native files
        shell: bash
        run: |
          set -e

          JAVA_DIR="android/app/sr
