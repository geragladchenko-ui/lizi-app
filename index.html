<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4500" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lizi Fire" />
  <title>Lizi Fire Voice</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 30%, #1a0802 0%, #080302 60%, #000 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 16px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.15rem; font-weight: 800; color: #ff6a00; display:flex; align-items:center; gap:8px; }
    .status { font-size: 0.75rem; color: #39ff14; background: rgba(57,255,20,0.15); padding: 4px 10px; border-radius: 20px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      gap: 16px;
    }
    #fireCanvas {
      width: 260px;
      height: 260px;
      cursor: pointer;
    }
    .hint { font-size: 0.85rem; color: #ffaa60; text-align: center; }
    .dialog { width: 100%; max-width: 420px; background: rgba(25,10,5,0.85); border: 1px solid #ff5500; border-radius: 16px; padding: 14px; min-height: 80px; }
    .dialog-header { font-size: 0.7rem; color: #ff8833; margin-bottom: 6px; text-transform: uppercase; }
    .dialog-text { font-size: 0.95rem; line-height: 1.4; color: #fff; }
    footer { padding: 16px; display: flex; justify-content: center; }
    .mic-btn {
      width: 100%;
      max-width: 280px;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: linear-gradient(135deg, #ff7a00, #ff2200);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,69,0,0.6);
    }
    .mic-btn.active { background: #39ff14; color:#000; box-shadow: 0 0 30px #39ff14; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🔥 LIZI FIRE CORE</div>
    <div class="status" id="st">ГОТОВА</div>
  </header>
  <main>
    <canvas id="fireCanvas" width="260" height="260"></canvas>
    <div class="hint" id="ht">Тапни по огню или кнопке, чтобы сказать</div>
    <div class="dialog">
      <div class="dialog-header" id="dh">ЛИЗИ</div>
      <div class="dialog-text" id="dt">Герман, огонь горит! Я готова слушать твои команды.</div>
    </div>
  </main>
  <footer>
    <button class="mic-btn" id="mb">СКАЗАТЬ ЛИЗИ</button>
  </footer>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    const cvs = document.getElementById('fireCanvas');
    const ctx = cvs.getContext('2d');
    let t = 0, isL = false, isS = false;
    function draw() {
      t += 0.04;
      ctx.clearRect(0,0,260,260);
      const sc = isL ? 1.3 : (isS ? 1.15 : 1.0);
      const g = ctx.createRadialGradient(130,130,10,130,130,110*sc);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.2, '#ffe066');
      g.addColorStop(0.5, '#ff5500');
      g.addColorStop(0.85, '#aa0000');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const a = (i/24) * Math.PI * 2;
        const r = (75 + Math.sin(a*4 + t*3)*8*sc + Math.cos(a*6 - t*2)*5*sc) * sc;
        const x = 130 + Math.cos(a)*r;
        const y = 130 + Math.sin(a)*r;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.fill();
      requestAnimationFrame(draw);
    }
    draw();
    function speak(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.onstart = () => { isS = true; document.getElementById('st').textContent = 'ГОВОРИТ'; };
      u.onend = () => { isS = false; document.getElementById('st').textContent = 'ГОТОВА'; };
      window.speechSynthesis.speak(u);
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    if (SR) {
      rec = new SR();
      rec.lang = 'ru-RU';
      rec.onstart = () => {
        isL = true;
        document.getElementById('mb').classList.add('active');
        document.getElementById('mb').textContent = 'СЛУШАЮ...';
        document.getElementById('st').textContent = 'СЛУШАЕТ';
      };
      rec.onresult = (e) => {
        const q = e.results[0][0].transcript;
        document.getElementById('dt').textContent = q;
        ask(q);
      };
      rec.onend = rec.onerror = () => {
        isL = false;
        document.getElementById('mb').classList.remove('active');
        document.getElementById('mb').textContent = 'СКАЗАТЬ ЛИЗИ';
        document.getElementById('st').textContent = 'ГОТОВА';
      };
    }
    function toggle() {
      if (!rec) { alert('Микрофон недоступен'); return; }
      if (isL) rec.stop(); else rec.start();
    }
    document.getElementById('mb').onclick = toggle;
    cvs.onclick = toggle;
    async function ask(q) {
      document.getElementById('dh').textContent = 'ЛИЗИ ДУМАЕТ...';
      try {
        const key = localStorage.getItem('LIZI_API_KEY') || '';
        if (!key) {
          const ans = 'Герман, огонь горит! Я услышала твою команду: ' + q;
          document.getElementById('dt').textContent = ans;
          document.getElementById('dh').textContent = 'ЛИЗИ';
          speak(ans);
          return;
        }
        const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'google/gemini-2.0-flash-exp:free',
            messages: [
              { role: 'system', content: 'Ты Lizi, персональный огненный ассистент Германа. Отвечай бодро, кратко (2 предложения) на русском языке.' },
              { role: 'user', content: q }
            ]
          })
        });
        const d = await r.json();
        const ans = d.choices?.[0]?.message?.content || 'Огонь горит!';
        document.getElementById('dt').textContent = ans;
        document.getElementById('dh').textContent = 'ЛИЗИ ОТВЕТИЛА';
        speak(ans);
      } catch (e) {
        const fb = 'Я тебя услышала, Герман! Огонь на связи.';
        document.getElementById('dt').textContent = fb;
        speak(fb);
      }
    }
  </script>
</body>
</html>
