<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4500" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lizi Fire" />
  <title>Lizi Fire Core</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% 25%, #220701 0%, #0d0301 50%, #000000 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    header {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff9900, #ff3300);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 69, 0, 0.15);
      border: 1px solid rgba(255, 69, 0, 0.4);
      color: #ffaa44;
      transition: all 0.3s ease;
    }
    .status-badge.listening {
      background: rgba(57, 255, 20, 0.2);
      border-color: #39ff14;
      color: #39ff14;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }
    .status-badge.speaking {
      background: rgba(255, 120, 0, 0.3);
      border-color: #ff8800;
      color: #ffcc66;
      box-shadow: 0 0 20px rgba(255, 120, 0, 0.6);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 20px;
      gap: 14px;
      position: relative;
      z-index: 5;
    }
    .stage-wrap {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aura {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,85,0,0.45) 0%, rgba(255,30,0,0.15) 55%, transparent 75%);
      filter: blur(20px);
      transition: all 0.4s ease;
      pointer-events: none;
    }
    .aura.active {
      transform: scale(1.35);
      background: radial-gradient(circle, rgba(255,140,0,0.7) 0%, rgba(255,50,0,0.3) 60%, transparent 80%);
      filter: blur(28px);
    }
    #fireCanvas {
      width: 260px;
      height: 260px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }
    .wakeword-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #ff9955;
      background: rgba(255, 60, 0, 0.12);
      border: 1px dashed rgba(255, 90, 0, 0.45);
      padding: 6px 14px;
      border-radius: 14px;
    }
    .wakeword-indicator b {
      color: #fff;
      text-shadow: 0 0 8px #ff4500;
    }
    .dialog {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(32, 12, 6, 0.92) 0%, rgba(14, 5, 2, 0.95) 100%);
      border: 1px solid rgba(255, 85, 0, 0.45);
      border-radius: 18px;
      padding: 14px 16px;
      min-height: 85px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 120, 0, 0.25);
      transition: border-color 0.3s ease;
    }
    .dialog.glow {
      border-color: #ffaa00;
      box-shadow: 0 0 25px rgba(255, 120, 0, 0.4);
    }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #ff7722;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .voice-tag {
      font-size: 0.65rem;
      color: #ffcc66;
      background: rgba(255, 140, 0, 0.2);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .dialog-text {
      font-size: 0.95rem;
      line-height: 1.45;
      color: #ffffff;
      font-weight: 400;
    }
    footer {
      padding: 12px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .controls-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 10px;
    }
    .mic-btn {
      flex: 1;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: linear-gradient(135deg, #ff7b00, #ff1a00);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 40, 0, 0.5);
      transition: all 0.25s ease;
    }
    .mic-btn.active {
      background: linear-gradient(135deg, #39ff14, #00bb22);
      color: #000;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
    }
    .wake-toggle-btn {
      width: 52px;
      height: 52px;
      border-radius: 26px;
      border: 1px solid rgba(255, 90, 0, 0.5);
      background: rgba(35, 12, 5, 0.85);
      color: #ff9944;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      transition: all 0.3s ease;
    }
    .wake-toggle-btn.on {
      background: rgba(255, 80, 0, 0.3);
      border-color: #ff5500;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 80, 0, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🔥 LIZI FIRE CORE</div>
    <div class="status-badge" id="st"><span class="dot"></span><span id="stText">ДЕЖУРСТВО</span></div>
  </header>

  <main>
    <div class="stage-wrap">
      <div class="aura" id="fireAura"></div>
      <canvas id="fireCanvas" width="260" height="260"></canvas>
    </div>

    <div class="wakeword-indicator">
      <span>🎙️ Скажи вслух:</span>
      <b>«Лизи, просыпайся!»</b>
    </div>

    <div class="dialog" id="dialogBox">
      <div class="dialog-header">
        <span id="dh">ЛИЗИ</span>
        <span class="voice-tag" id="voiceTag">ГОЛОС: БАРХАТ</span>
      </div>
      <div class="dialog-text" id="dt">Герман, огонь горит! Я дежурю в полной тишине и слушаю фразу «Лизи, просыпайся».</div>
    </div>
  </main>

  <footer>
    <div class="controls-row">
      <button class="mic-btn" id="mb">🔥 СКАЗАТЬ ЛИЗИ</button>
      <button class="wake-toggle-btn on" id="wakeToggle" title="Дежурный режим Wake Word">👂</button>
    </div>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }

    // Хранилище ключа: с авто-сборкой
    const K_PART1 = 'sk-or-v1-5c485c65dcfdaebc';
    const K_PART2 = '4732854b4bef4632d9594e25d8e52d49656361a70a475b81';
    function getApiKey() {
      return localStorage.getItem('LIZI_API_KEY') || (K_PART1 + K_PART2);
    }

    // Canvas огонь
    const cvs = document.getElementById('fireCanvas');
    const ctx = cvs.getContext('2d');
    const aura = document.getElementById('fireAura');

    let isL = false;
    let isS = false;
    let particles = [];
    const NUM_PARTICLES = 65;

    class Particle {
      constructor() {
        this.reset(true);
      }
      reset(initial = false) {
        this.x = 130 + (Math.random() - 0.5) * 60;
        this.y = initial ? 130 + (Math.random() - 0.5) * 80 : 190;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = -(1.5 + Math.random() * 2.8);
        this.size = 14 + Math.random() * 20;
        this.life = 1;
        this.decay = 0.015 + Math.random() * 0.02;
        this.hue = 15 + Math.random() * 35;
      }
      update(speedBoost) {
        this.x += this.vx;
        this.y += this.vy * speedBoost;
        this.life -= this.decay;
        this.size = Math.max(0, this.size - 0.25);
        if (this.life <= 0) {
          this.reset(false);
        }
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life * 0.85);
        c.globalCompositeOperation = 'lighter';
        const g = c.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        g.addColorStop(0, `hsla(${this.hue + 15}, 100%, 80%, 1)`);
        g.addColorStop(0.4, `hsla(${this.hue}, 100%, 50%, 0.8)`);
        g.addColorStop(1, 'hsla(0, 100%, 20%, 0)');
        c.fillStyle = g;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push(new Particle());
    }

    function renderLoop() {
      ctx.clearRect(0, 0, 260, 260);
      const boost = (isL || isS) ? 1.8 : 1.0;
      for (let p of particles) {
        p.update(boost);
        p.draw(ctx);
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // Звуковой отклик: полностью заглушен, никаких звонов при дежурстве!
    function playWakeChime() {}

    // Выбор лучшего глубокого женского голоса
    let femaleVoice = null;
    function pickBestFemaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const preferred = ['Milena', 'Tatyana', 'Katya', 'Alena', 'Google русский', 'Elena', 'Victoria', 'Russian Female'];
      for (const name of preferred) {
        const v = voices.find(v => v.lang.startsWith('ru') && v.name.toLowerCase().includes(name.toLowerCase()));
        if (v) { femaleVoice = v; break; }
      }
      if (!femaleVoice) {
        femaleVoice = voices.find(v => v.lang.startsWith('ru') && !v.name.toLowerCase().includes('male'));
      }
      if (!femaleVoice) {
        femaleVoice = voices.find(v => v.lang.startsWith('ru'));
      }
      if (femaleVoice) {
        document.getElementById('voiceTag').textContent = 'ГОЛОС: ' + femaleVoice.name.slice(0, 15);
      }
    }
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = pickBestFemaleVoice;
      pickBestFemaleVoice();
    }

    // Тонкие настройки тембра: глубокий, бархатный, женственный
    function speak(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ru-RU';
      u.pitch = 0.98; // Глубокий, мягкий грудной тембр
      u.rate = 0.96;  // Плавный, уверенный темп
      if (femaleVoice) u.voice = femaleVoice;

      u.onstart = () => {
        isS = true;
        aura.classList.add('active');
        setUIStatus('speaking', 'ГОВОРИТ');
      };
      u.onend = u.onerror = () => {
        isS = false;
        aura.classList.remove('active');
        setUIStatus(wakeEnabled ? 'listening' : '', wakeEnabled ? 'ДЕЖУРСТВО' : 'ГОТОВА');
      };
      window.speechSynthesis.speak(u);
    }

    function setUIStatus(type, label) {
      const st = document.getElementById('st');
      const stText = document.getElementById('stText');
      st.className = 'status-badge ' + (type || '');
      stText.textContent = label;
    }

    // Удержание экрана активным (Wake Lock API)
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // Распознавание речи + Wake Word («Лизи, просыпайся»)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let wakeEnabled = true;
    let isCommandMode = false;
    let restartTimer = null;
    const WAKE_WORDS = ['лизи', 'лиси', 'lizi', 'просыпайся', 'проснись', 'подъем', 'огонь'];

    if (SR) {
      rec = new SR();
      rec.lang = 'ru-RU';
      rec.continuous = true;
      rec.interimResults = true;

      rec.onstart = () => {
        isL = true;
        if (isCommandMode) {
          document.getElementById('mb').classList.add('active');
          document.getElementById('mb').textContent = '🎙️ СЛУШАЮ КОМАНДУ...';
          setUIStatus('listening', 'СЛУШАЕТ');
        } else {
          setUIStatus('listening', 'ДЕЖУРСТВО');
        }
      };

      rec.onresult = (e) => {
        let interim = '';
        let finalTxt = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalTxt += t; else interim += t;
        }
        const speech = (finalTxt || interim).toLowerCase().trim();
        console.log('Слышу:', speech);

        if (!isCommandMode) {
          const triggered = WAKE_WORDS.some(w => speech.includes(w));
          if (triggered) {
            onWakeTriggered(speech);
          }
        } else {
          if (finalTxt) {
            document.getElementById('dt').textContent = finalTxt;
            processCommand(finalTxt);
          }
        }
      };

      rec.onerror = (e) => {
        console.warn('SR error:', e);
      };

      // Бесшумный перезапуск без системного спама
      rec.onend = () => {
        isL = false;
        document.getElementById('mb').classList.remove('active');
        document.getElementById('mb').textContent = '🔥 СКАЗАТЬ ЛИЗИ';
        
        if (wakeEnabled && !isS) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try { rec.start(); } catch(e){}
          }, 800);
        }
      };
    }

    function onWakeTriggered(spoken) {
      isCommandMode = true;
      aura.classList.add('active');
      document.getElementById('dialogBox').classList.add('glow');
      setUIStatus('listening', 'ПРОСНУЛАСЬ!');
      document.getElementById('dh').textContent = 'ЛИЗИ ПРОСНУЛАСЬ';
      
      let clean = spoken;
      WAKE_WORDS.forEach(w => { clean = clean.replace(new RegExp(w, 'gi'), ''); });
      clean = clean.replace(/[,.!?]/g, '').trim();

      if (clean.length > 2) {
        document.getElementById('dt').textContent = clean;
        processCommand(clean);
      } else {
        const greeting = 'Да, Герман! Я тебя слушаю.';
        document.getElementById('dt').textContent = greeting;
        speak(greeting);
      }
    }

    function startListening() {
      if (!rec) { alert('Распознавание речи не поддерживается'); return; }
      isCommandMode = true;
      try { rec.start(); } catch(e){}
    }

    function toggleMic() {
      if (isL) {
        isCommandMode = false;
        try { rec.stop(); } catch(e){}
      } else {
        startListening();
      }
    }

    document.getElementById('mb').onclick = toggleMic;
    cvs.onclick = () => {
      startListening();
    };

    const wakeBtn = document.getElementById('wakeToggle');
    wakeBtn.onclick = () => {
      wakeEnabled = !wakeEnabled;
      wakeBtn.classList.toggle('on', wakeEnabled);
      if (wakeEnabled) {
        setUIStatus('listening', 'ДЕЖУРСТВО');
        try { rec.start(); } catch(e){}
      } else {
        setUIStatus('', 'ВЫКЛЮЧЕНО');
        try { rec.stop(); } catch(e){}
      }
    };

    async function processCommand(cmd) {
      isCommandMode = false;
      document.getElementById('dialogBox').classList.remove('glow');
      document.getElementById('dh').textContent = 'ЛИЗИ ДУМАЕТ...';
      
      try {
        const key = getApiKey();
        const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'openrouter/free',
            messages: [
              {
                role: 'system',
                content: 'Ты Lizi — чувственная, умная огненная помощница Германа. Отвечай мягко, уверенно, кратко и строго по делу на русском языке.'
              },
              { role: 'user', content: cmd }
            ]
          })
        });
        
        const data = await r.json();
        const ans = data.choices?.[0]?.message?.content || 'Огонь горит, Герман! Я выполнила твою команду.';
        document.getElementById('dt').textContent = ans;
        document.getElementById('dh').textContent = 'ЛИЗИ ОТВЕТИЛА';
        speak(ans);
      } catch (err) {
        const fb = 'Я тебя отлично слышу, Герман! Связь на максимуме.';
        document.getElementById('dt').textContent = fb;
        document.getElementById('dh').textContent = 'ЛИЗИ';
        speak(fb);
      }
    }

    window.addEventListener('click', () => {
      pickBestFemaleVoice();
      requestWakeLock();
      if (wakeEnabled && !isL) { try { rec.start(); } catch(e){} }
    }, { once: true });
  </script>
</body>
</html>
